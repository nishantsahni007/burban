name: Update availability data

on:
  schedule:
    - cron: "37 1 * * *"   # every day, ~7:07 am IST
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect evidence and rebuild the app's data
        run: python -u pipeline/run_all.py

      - name: Save results
        run: |
          git config user.name "burban-bot"
          git config user.email "burban-bot@users.noreply.github.com"
          git add -A data pipeline/evidence pipeline/geo
          git diff --cached --quiet && echo "No changes" || git commit -q -m "Daily data update $(date -u +%F)"
          git push

      # If something broke, fail here so GitHub emails you. The app keeps the last good data.
      - name: Check health
        run: |
          python -c "import json,sys; h=json.load(open('pipeline/evidence/health.json')); [print('PROBLEM:', p) for p in h['problems']]; sys.exit(0 if h['ok'] else 1)"
