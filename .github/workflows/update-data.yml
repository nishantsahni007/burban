name: Update availability data

on:
  schedule:
    - cron: "37 1 * * *"   # every day, ~7:07 am IST
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect evidence and rebuild data.json
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: python pipeline/run_all.py

      - name: Save results
        run: |
          git config user.name "burban-bot"
          git config user.email "burban-bot@users.noreply.github.com"
          git add data.json pipeline/evidence
          git diff --cached --quiet && echo "No changes" || git commit -m "Daily data update $(date -u +%F)"
          git push
